# Claude Code auto mode처럼: 기본은 전부 자동 허용, 위험한 명령만 물어봄
# 우선순위 deny > ask > allow (Cedar forbid가 permit을 이김)
rules:
  - capability: all
    effect: allow

  - capability: shell
    match:
      - "sudo *"
      - "rm -rf /*"
      - "rm -rf ~*"
      - "git push *--force*"
      - "git push -f*"
      - "git reset --hard*"
      - "git clean -f*"
    effect: ask

  # 커밋·푸시는 사람이 직접 한다. Kiro는 커밋 메시지에 무엇을 적을지만 제안한다.
  # (같은 규칙을 PreToolUse 훅 gate_hook.sh 도 강제한다 — 이 파일을 못 읽는 환경 대비)
  - capability: shell
    match:
      - "git commit*"
      - "git push*"
      - "git * commit*"
      - "git * push*"
      - "* && git commit*"
      - "* && git push*"
      - "*; git commit*"
      - "*; git push*"
      - "gh pr create*"
      - "gh pr merge*"
    effect: deny
